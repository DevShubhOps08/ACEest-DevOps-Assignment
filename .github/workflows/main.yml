name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask pytest
        pip install -r requirements.txt

    - name: Build & Lint (Syntax Check)
      run: |
        python -m py_compile app.py test_app.py

    - name: Run Unit Tests
      run: |
        python -m pytest test_app.py -v

    - name: Build Docker Image
      run: |
        docker build -t aceest-fitness-app:latest .

    - name: Execute Pytest Inside Docker Container
      run: |
        docker run --rm aceest-fitness-app:latest python -m pytest test_app.py -v
